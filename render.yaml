services:
  - type: web
    name: meetingassist
    env: go
    plan: free
    buildCommand: |
      go build -o main .
      pip install SpeechRecognition PyMuPDF Pillow
    startCommand: ./main
    envVars:
      - key: PORT
        value: 8082
      - key: ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 6543
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: postgres
      - key: DB_SSLMODE
        value: disable
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 168h
      - key: MAX_AUDIO_SIZE
        value: 104857600
      - key: MAX_DOCUMENT_SIZE
        value: 52428800
      - key: MAX_STORAGE_PER_USER
        value: 1073741824
      - key: TESSERACT_PATH
        value: tesseract
      - key: FRONTEND_URL
        value: https://meetingassist.onrender.com
