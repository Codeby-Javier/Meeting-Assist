<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Dokumen - MeetingAssist</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
</head>

<body>
    <div class="sidebar">
        <h3 class="text-center mb-4 mt-2">MeetingAssist</h3>
        <a href="/dashboard" class="sidebar-link">Dashboard</a>
        <a href="/audio/upload" class="sidebar-link">Unggah Audio</a>
        <a href="/document/upload" class="sidebar-link">Unggah Dokumen</a>
        <a href="/history" class="sidebar-link active">Riwayat</a>
        <a href="/profile" class="sidebar-link">Profil</a>
        <a href="#" onclick="removeToken()" class="sidebar-link text-danger">Keluar</a>
    </div>

    <div class="main-content">
        <button id="sidebar-toggle" class="btn btn-outline-dark d-md-none mb-3">☰</button>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Editor Dokumen</h2>
            <div>
                <button class="btn btn-success me-2" onclick="saveText()">Simpan Perubahan</button>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary dropdown-toggle"
                        data-bs-toggle="dropdown">Ekspor</button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#" onclick="exportFile('pdf')">PDF</a></li>
                        <li><a class="dropdown-item" href="#" onclick="exportFile('docx')">Word</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="row h-100">
            <div class="col-md-6">
                <div class="card p-2 h-100" style="min-height: 500px;">
                    <h5 class="card-title">Dokumen Asli</h5>
                    <div class="bg-light d-flex align-items-center justify-content-center h-100 overflow-auto">
                        <img id="doc-preview" src="" alt="Pratinjau Dokumen" class="img-fluid"
                            style="max-height: 100%;">
                        <iframe id="pdf-preview" src="" class="w-100 h-100 d-none"></iframe>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-2 h-100" style="min-height: 500px;">
                    <h5 class="card-title">Teks Hasil Ekstraksi</h5>
                    <textarea id="text-editor" class="form-control h-100" style="min-height: 450px;"></textarea>
                </div>
            </div>
        </div>

        <footer class="text-center py-3 mt-4">
            <p class="mb-0 text-muted">By <a href="https://instagram.com/ibnu.jz"
                    class="text-dark text-decoration-none fw-bold" target="_blank">@ibnu.jz</a></p>
        </footer>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        checkAuth();
        const id = window.location.pathname.split('/').pop();
        let currentFilename = 'document';

        async function loadData() {
            try {
                const res = await apiCall(`/document/${id}`);
                const data = res.data;
                currentFilename = data.filename.split('.')[0];

                const docUrl = '/' + data.file_path.replace(/\\/g, '/');

                if (data.filename.toLowerCase().endsWith('.pdf')) {
                    document.getElementById('doc-preview').classList.add('d-none');
                    const iframe = document.getElementById('pdf-preview');
                    iframe.src = docUrl;
                    iframe.classList.remove('d-none');
                } else {
                    document.getElementById('doc-preview').src = docUrl;
                }

                if (data.texts && data.texts.length > 0) {
                    document.getElementById('text-editor').value = data.texts[0].text;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function saveText() {
            const text = document.getElementById('text-editor').value;
            try {
                await apiCall(`/document/${id}`, 'PUT', { text });
                showToast('Teks berhasil disimpan', 'success');
            } catch (e) {
                console.error(e);
            }
        }

        async function exportFile(type) {
            const content = document.getElementById('text-editor').value;
            try {
                const token = getToken();
                const response = await fetch(`/api/export/${type}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content, filename: currentFilename })
                });

                if (!response.ok) throw new Error('Ekspor gagal');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentFilename}.${type}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                showToast(e.message, 'danger');
            }
        }

        // Auto-save
        setInterval(() => {
            if (document.getElementById('text-editor').value) {
                saveText();
            }
        }, 30000);

        loadData();
    </script>
</body>

</html>
