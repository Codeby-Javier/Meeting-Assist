<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - MeetingAssist</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card p-4 shadow">
                    <h3 class="text-center mb-4">Masuk</h3>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Masuk</button>
                    </form>
                    <p class="mt-3 text-center">Belum punya akun? <a href="/register">Daftar</a></p>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 mt-5 fixed-bottom">
        <div class="container">
            <p class="mb-0 text-muted">By <a href="https://instagram.com/ibnu.jz"
                    class="text-dark text-decoration-none fw-bold" target="_blank">@ibnu.jz</a></p>
        </div>
    </footer>

    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await apiCall('/auth/login', 'POST', { email, password });
                setToken(res.data.token);
                window.location.href = '/dashboard';
            } catch (err) {
                // Error handled in apiCall
            }
        });
    </script>
</body>

</html>
