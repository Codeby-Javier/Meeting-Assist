<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - MeetingAssist</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
</head>

<body>
    <div class="sidebar">
        <h3 class="text-center mb-4 mt-2">MeetingAssist</h3>
        <a href="/dashboard" class="sidebar-link">Dashboard</a>
        <a href="/audio/upload" class="sidebar-link">Unggah Audio</a>
        <a href="/document/upload" class="sidebar-link">Unggah Dokumen</a>
        <a href="/history" class="sidebar-link">Riwayat</a>
        <a href="/profile" class="sidebar-link active">Profil</a>
        <a href="#" onclick="removeToken()" class="sidebar-link text-danger">Keluar</a>
    </div>

    <div class="main-content">
        <button id="sidebar-toggle" class="btn btn-outline-dark d-md-none mb-3">☰</button>
        <h2 class="mb-4">Profil</h2>

        <div class="card p-4">
            <form>
                <div class="mb-3">
                    <label class="form-label">Nama</label>
                    <input type="text" class="form-control" value="Pengguna" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" value="user@example.com" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">Peran</label>
                    <input type="text" class="form-control" value="Anggota" readonly>
                </div>
            </form>
            <div class="alert alert-info mt-3">
                Pengeditan profil akan segera hadir.
            </div>
        </div>

        <footer class="text-center py-3 mt-4">
            <p class="mb-0 text-muted">By <a href="https://instagram.com/ibnu.jz"
                    class="text-dark text-decoration-none fw-bold" target="_blank">@ibnu.jz</a></p>
        </footer>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js"></script>
    <script>
        checkAuth();
        // In a real app, fetch user profile
    </script>
</body>

</html>
