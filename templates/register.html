<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - MeetingAssist</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card p-4 shadow">
                    <h3 class="text-center mb-4">Daftar</h3>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Daftar</button>
                    </form>
                    <p class="mt-3 text-center">Sudah punya akun? <a href="/login">Masuk</a></p>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 mt-5 fixed-bottom">
        <div class="container">
            <p class="mb-0 text-muted">By <a href="https://instagram.com/ibnu.jz"
                    class="text-dark text-decoration-none fw-bold" target="_blank">@ibnu.jz</a></p>
        </div>
    </footer>

    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await apiCall('/auth/register', 'POST', { name, email, password });
                showToast('Pendaftaran berhasil! Silakan masuk.', 'success');
                setTimeout(() => window.location.href = '/login', 2000);
            } catch (err) {
                // Error handled in apiCall
            }
        });
    </script>
</body>

</html>
