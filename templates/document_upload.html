<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unggah Dokumen - MeetingAssist</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
    <style>
        #camera-preview {
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            margin: 20px auto;
            display: none;
        }

        #captured-image {
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            margin: 20px auto;
            display: none;
        }

        .camera-controls {
            display: none;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .camera-controls.active {
            display: flex;
        }

        @media (max-width: 768px) {
            .upload-area {
                padding: 20px !important;
            }

            .upload-area h4 {
                font-size: 1.1rem;
            }

            .camera-controls button {
                font-size: 0.9rem;
                padding: 8px 16px;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h3 class="text-center mb-4 mt-2">MeetingAssist</h3>
        <a href="/dashboard" class="sidebar-link">Dashboard</a>
        <a href="/audio/upload" class="sidebar-link">Unggah Audio</a>
        <a href="/document/upload" class="sidebar-link active">Unggah Dokumen</a>
        <a href="/history" class="sidebar-link">Riwayat</a>
        <a href="/profile" class="sidebar-link">Profil</a>
        <a href="#" onclick="removeToken()" class="sidebar-link text-danger">Keluar</a>
    </div>

    <div class="main-content">
        <button id="sidebar-toggle" class="btn btn-outline-dark d-md-none mb-3">☰</button>
        <h2 class="mb-4">Unggah Dokumen</h2>

        <div class="card p-4 p-md-5">
            <div class="upload-area" id="drop-zone">
                <!-- SVG Icon for Document -->
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor"
                    class="bi bi-file-earmark-text mb-3 text-primary" viewBox="0 0 16 16">
                    <path
                        d="M5.5 7a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1h-5zM5 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm0 2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5z" />
                    <path
                        d="M9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.5L9.5 0zm0 1v2A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5z" />
                </svg>
                <h4>Tarik & Lepas Gambar/PDF Di Sini</h4>
                <p class="text-muted mb-2">Maksimal file 3MB</p>
                <p>atau</p>
                <input type="file" id="docInput" accept="image/*,application/pdf,.heic,.heif" class="d-none">
                <div class="d-flex gap-2 flex-wrap justify-content-center">
                    <button class="btn btn-primary" onclick="document.getElementById('docInput').click()">
                        <i class="bi bi-folder"></i> Pilih File
                    </button>
                    <button class="btn btn-success" id="open-camera-btn">
                        <i class="bi bi-camera"></i> Ambil Foto
                    </button>
                </div>
            </div>

            <!-- Camera Preview -->
            <video id="camera-preview" autoplay playsinline></video>
            <canvas id="captured-image" style="display: none;"></canvas>

            <!-- Camera Controls -->
            <div class="camera-controls" id="camera-controls">
                <button class="btn btn-primary" id="capture-btn">
                    <i class="bi bi-camera-fill"></i> Ambil Gambar
                </button>
                <button class="btn btn-warning" id="retake-btn" style="display: none;">
                    <i class="bi bi-arrow-clockwise"></i> Foto Ulang
                </button>
                <button class="btn btn-success" id="use-photo-btn" style="display: none;">
                    <i class="bi bi-check-circle"></i> Gunakan Foto
                </button>
                <button class="btn btn-secondary" id="close-camera-btn">
                    <i class="bi bi-x-circle"></i> Tutup
                </button>
            </div>

            <div class="mt-4">
                <div class="progress">
                    <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <footer class="text-center py-3 mt-4">
            <p class="mb-0 text-muted">By <a href="https://instagram.com/ibnu.jz"
                    class="text-dark text-decoration-none fw-bold" target="_blank">@ibnu.jz</a></p>
        </footer>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js"></script>
    <script>
        checkAuth();

        const dropZone = document.getElementById('drop-zone');
        const docInput = document.getElementById('docInput');
        const cameraPreview = document.getElementById('camera-preview');
        const capturedCanvas = document.getElementById('captured-image');
        const cameraControls = document.getElementById('camera-controls');
        const openCameraBtn = document.getElementById('open-camera-btn');
        const closeCameraBtn = document.getElementById('close-camera-btn');
        const captureBtn = document.getElementById('capture-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const usePhotoBtn = document.getElementById('use-photo-btn');

        let stream = null;
        let capturedBlob = null;

        // Drag and drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--primary-color)';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ccc';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ccc';
            docInput.files = e.dataTransfer.files;
            handleFileUpload('docInput', '/document/upload', 'document');
        });

        docInput.addEventListener('change', () => {
            handleFileUpload('docInput', '/document/upload', 'document');
        });

        // Camera functionality
        openCameraBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' } // Use back camera on mobile
                });
                cameraPreview.srcObject = stream;
                cameraPreview.style.display = 'block';
                cameraControls.classList.add('active');
                dropZone.style.display = 'none';
            } catch (err) {
                alert('Tidak dapat mengakses kamera. Pastikan Anda memberikan izin kamera.');
                console.error('Camera error:', err);
            }
        });

        closeCameraBtn.addEventListener('click', () => {
            stopCamera();
        });

        captureBtn.addEventListener('click', () => {
            const context = capturedCanvas.getContext('2d');
            capturedCanvas.width = cameraPreview.videoWidth;
            capturedCanvas.height = cameraPreview.videoHeight;
            context.drawImage(cameraPreview, 0, 0);

            // Hide video, show canvas
            cameraPreview.style.display = 'none';
            capturedCanvas.style.display = 'block';

            // Update buttons
            captureBtn.style.display = 'none';
            retakeBtn.style.display = 'inline-block';
            usePhotoBtn.style.display = 'inline-block';

            // Convert canvas to blob
            capturedCanvas.toBlob((blob) => {
                capturedBlob = blob;
            }, 'image/jpeg', 0.95);
        });

        retakeBtn.addEventListener('click', () => {
            cameraPreview.style.display = 'block';
            capturedCanvas.style.display = 'none';
            captureBtn.style.display = 'inline-block';
            retakeBtn.style.display = 'none';
            usePhotoBtn.style.display = 'none';
            capturedBlob = null;
        });

        usePhotoBtn.addEventListener('click', () => {
            if (capturedBlob) {
                // Create a file from blob
                const file = new File([capturedBlob], `camera_${Date.now()}.jpg`, { type: 'image/jpeg' });
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                docInput.files = dataTransfer.files;

                // Upload the file
                handleFileUpload('docInput', '/document/upload', 'document');

                // Close camera
                stopCamera();
            }
        });

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            cameraPreview.style.display = 'none';
            capturedCanvas.style.display = 'none';
            cameraControls.classList.remove('active');
            dropZone.style.display = 'block';
            captureBtn.style.display = 'inline-block';
            retakeBtn.style.display = 'none';
            usePhotoBtn.style.display = 'none';
            capturedBlob = null;
        }
    </script>
</body>

</html>
